name: Cats Dogs MLOps CI CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  IMAGE_NAME: cats-dogs-api

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify model artifact
        run: |
          echo "Checking model artifact..."
          ls -lh models
          test -f models/cats_dogs_model.keras
          python -c "from pathlib import Path; p=Path('models/cats_dogs_model.keras'); print('Model size MB:', round(p.stat().st_size/1024/1024,2)); assert p.stat().st_size > 1000000"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.111.0 uvicorn==0.30.1 python-multipart==0.0.9 pillow==10.3.0 numpy==1.26.4 pytest==8.2.2 httpx==0.27.0 prometheus-fastapi-instrumentator==7.0.0 tensorflow-cpu==2.16.1 keras==3.3.3

      - name: Run unit tests
        run: |
          python -m pytest tests -v

      - name: Docker login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest